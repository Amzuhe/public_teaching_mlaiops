# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

service: itcs355-predict

objectives:
  - name: availability
    # 99.5% over 30 days = a 3.6-hour error budget. The service is a maintenance-planning aid
    # read a few times a day, not a safety interlock: a 20-minute outage delays a work order,
    # it does not break a machine. 99.9% (43 min/month) would need multi-zone serving we
    # cannot justify for this use, so 0.995 is a target we can actually keep.
    target: 0.995
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Freeze feature and model deploys until the 30-day error rate is back under budget;
      only fixes and rollbacks ship. Roll back to the last known-good image SHA first,
      then write a post-mortem on what spent the budget.

  - name: latency
    # 200 ms p95 at the endpoint. A maintenance planner waits on one prediction at a time,
    # and 200 ms still feels instant. The model itself gets 50 ms of it (LATENCY_BUDGET_MS in
    # tests/test_model_behaviour.py; measured p95 17.4 ms); the rest is network, validation
    # and serialisation. No Lab 3 k6 target exists yet, so this file is the source of truth.
    target_p95_ms: 200
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Stop shipping changes that make the model bigger or slower, profile the slowest 1% of
      requests, and add one instance while we find the cause. If a new model version caused
      it, roll back to the previous version.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Retrain on the most recent 30 days of data, but only after the data contract tests
      and the drift check (monitoring/drift.py) pass on that data, so a broken upstream feed
      is never trained into the model. Any scheduled retrain must run at least every 30 days
      to match this target; a 90-day schedule would contradict it.
