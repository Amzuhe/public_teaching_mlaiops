# Lab 4 Task 4: the dashboard as code. Prometheus scrapes the service's /metrics; Grafana
# loads monitoring/dashboard.json on start. Fully local and portable, no cloud account.
#
#   uvicorn service.app:app --port 8080        # the service, on the host
#   docker compose -f monitoring/docker-compose.yml up -d
#   open http://localhost:3000  (anonymous viewer, dashboard "ITCS355 — Prediction service")
#   docker compose -f monitoring/docker-compose.yml down   # teardown

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard.json
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
